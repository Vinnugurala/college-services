{% extends 'services/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto; text-align: center;">
    <h2>Confirm Delete</h2>
    <p style="margin: 1.5rem 0;">Are you sure you want to delete <strong>{{ item.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button type="submit" class="btn btn-primary" style="background-color: #d32f2f;">Delete</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
