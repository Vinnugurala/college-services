{% extends 'services/base.html' %}

{% block title %}Login - Campus Services{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="card"
        style="width: 100%; max-width: 400px; padding: 3rem 2.5rem; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; background-color: #ffffff;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h2 style="color: #2c3e50; font-weight: 400; font-size: 2rem; font-family: 'Georgia', serif; margin: 0;">
                Welcome Back</h2>
            <p style="color: #7f8c8d; font-size: 0.95rem; margin-top: 0.5rem;">Please log in to continue</p>
        </div>

        <form method="post" style="display: flex; flex-direction: column; gap: 1.25rem;">
            {% csrf_token %}

            <style>
                /* Classic, clean input styles */
                .form-group p {
                    display: flex;
                    flex-direction: column;
                    gap: 0.4rem;
                    margin-bottom: 0;
                }

                .form-group label {
                    font-size: 0.9rem;
                    color: #34495e;
                    font-weight: 600;
                }

                .form-group input {
                    padding: 0.8rem 1rem;
                    border: 1px solid #ced4da;
                    border-radius: 4px;
                    font-size: 1rem;
                    transition: border-color 0.2s;
                    outline: none;
                }

                .form-group input:focus {
                    border-color: var(--secondary-color);
                    box-shadow: 0 0 0 2px rgba(33, 150, 243, 0.1);
                }
            </style>

            <div class="form-group">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn btn-primary"
                style="padding: 0.85rem; font-size: 1.05rem; font-weight: 500; border-radius: 4px; margin-top: 1rem; letter-spacing: 0.5px; text-transform: uppercase;">Sign
                In</button>
        </form>

        <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #eee;">
            <p style="font-size: 0.95rem; color: #7f8c8d; margin-bottom: 0.5rem;">Don't have an account?</p>
            <a href="{% url 'register' %}"
                style="color: var(--secondary-color); text-decoration: none; font-weight: 600;">Create an Account</a>
        </div>
    </div>
</div>
{% endblock %}
