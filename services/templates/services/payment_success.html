{% extends 'services/base.html' %}

{% block title %}Order Successful - Campus Services{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 4rem auto; text-align: center; padding: 3rem;">
    <div style="width: 80px; height: 80px; background-color: #4bb543; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 2rem;">
        ✓
    </div>
    <h2 style="margin-bottom: 1rem;">Payment Successful!</h2>
    <p style="color: #666; font-size: 1.1rem; margin-bottom: 2rem;">Your order has been placed and is being processed by the campus services.</p>
    
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{% url 'dashboard' %}" class="btn btn-primary" style="padding: 0.75rem 2rem;">Go to Dashboard</a>
        <a href="{% url 'home' %}" class="btn btn-secondary" style="padding: 0.75rem 2rem;">Back to Home</a>

</div>
